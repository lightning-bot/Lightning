[project]
name = "Lightning"
version = "4.0.0"
description = "Powerful moderation & utilities Discord App (Bot)"
authors = [{ name = "LightSage", email = "lightsage01@gmail.com" }]
requires-python = ">=3.10.0,<3.12"
readme = "README.md"
license = "AGPL-3.0-or-later"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
]
dependencies = [
    "discord.py[speed]",
    "python-dateutil>=2.8.1,<3",
    "parsedatetime>=2.6,<3",
    "psutil>=7.0.0,<8",
    "tabulate>=0.9.0,<0.10",
    "feedparser>=6.0.10,<7",
    "asyncpg>=0.30.0,<0.31",
    "discord-ext-menus",
    "lru_dict>=1.3.0,<2",
    "sentry-sdk>=2.0.0,<3.0.0",
    "py-flags>=1.1.4,<2",
    "jishaku>=2.6.0,<3",
    "rapidfuzz>=3.0.0,<4",
    "typer>=0.16.0,<0.17",
    "tomlkit>=0.13.2,<0.14",
    "uvloop>=0.22.1,<0.23 ; sys_platform == 'linux'",
    "orjson>=3.6.0,<4",
    "beautifulsoup4>=4.12.3,<5",
    "lxml>=6.1.0,<7",
    "sanctum-tc>=0.8.0,<0.9",
    "objgraph>=3.5.0,<4",
    "Wand>=0.6.11,<0.7",
    "rich>=14.0.0,<15",
    "setuptools>=83.0.0,<84",
    "numpy==1.26.4",
    "redis[hiredis]>=6.4.0,<7.0.0",
    "cryptography>=44.0.0,<45",
    "unidecode>=1.3.6,<2",
    "prometheus-async>=25.1.0,<26",
    "spacy>=3.8.5,<4",
    "pandas>=2.2.2,<3",
    "en-core-web-sm",
    "emoji>=2.14.1,<3",
    "matplotlib>=3.10.9",
]

[project.urls]
homepage = "https://lightningbot.app/"
repository = "https://github.com/lightning-bot/Lightning"

[project.scripts]
lightning = "lightning.cli.main:parser"

[dependency-groups]
dev = [
    "ruff>=0.12.8,<0.13",
    "isort>=6.0.1,<7",
    "pre-commit>=4.2.0,<5",
    "pytest>=9.0.3,<10",
]

[tool.uv]
default-groups = "all"

[tool.uv.sources]
"discord.py" = { git = "https://github.com/Rapptz/discord.py.git", branch = "master" }
discord-ext-menus = { git = "https://github.com/Rapptz/discord-ext-menus.git" }
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.hatch.build.targets.sdist]
include = [
    "lightning/**/*.py",
    "LICENSE",
    "LICENSE.header",
]

[tool.hatch.build.targets.wheel]
include = [
    "lightning/**/*.py",
    "LICENSE",
    "LICENSE.header",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.autopep8]
max_line_length = 120
ignore = ["E301", "F402"]
in-place = true
recursive = true
